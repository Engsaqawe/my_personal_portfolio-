{% extends "academy/base.html" %}
{% block title %}{{ 'Edit' if course else 'New' }} Course{% endblock %}
{% block content %}
<header class="acad-header">
  <div><h1>{{ 'Edit' if course else 'New' }} Course</h1></div>
  <a href="{{ url_for('academy.courses_list') }}" class="acad-btn acad-btn--ghost">← Back</a>
</header>
<form class="acad-card acad-form" method="POST" enctype="multipart/form-data">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <label>Title<input type="text" name="title" value="{{ course.title if course else '' }}" required /></label>
  <label>Short curriculum label<input type="text" name="modules" value="{{ course.modules if course else '' }}" placeholder="e.g. 8 modules" /></label>
  <label>Description<textarea name="description" rows="4" required>{{ course.description if course else '' }}</textarea></label>
  <label>Course thumbnail<input type="file" name="thumbnail_file" accept="image/png,image/jpeg,image/webp" /></label>
  <label>Or thumbnail URL<input type="text" name="thumbnail_url" value="{{ course.thumbnail_url if course and course.thumbnail_url else '' }}" placeholder="https://... or /static/images/course.jpg" /></label>
  {% if course and course.thumbnail_url %}<label class="acad-checkbox"><input type="checkbox" name="remove_thumbnail" value="1"> Remove current thumbnail</label>{% endif %}
  <div class="acad-form__row">
    <label>Category<select name="category_id"><option value="">Uncategorized</option>{% for category in categories %}<option value="{{ category.id }}" {% if course and course.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label>
    <label>Level<input type="text" name="level" maxlength="50" value="{{ course.level if course else 'Beginner' }}" /></label>
    <label>Language<input type="text" name="language" maxlength="50" value="{{ course.language if course else 'English' }}" /></label>
    <label>Price<input type="number" name="price" min="0" max="999999.99" step="0.01" value="{{ course.price if course else '0.00' }}" /><small>Set 0 for a free course.</small></label>
    <label>Currency<select name="currency">{% for code in ['USD','SOS','EUR','GBP'] %}<option value="{{ code }}" {% if (course.currency if course else 'USD') == code %}selected{% endif %}>{{ code }}</option>{% endfor %}</select></label>
    <label>Icon (Font Awesome)<input type="text" name="icon" value="{{ course.icon if course else 'fa-code' }}" placeholder="fa-code" /></label>
    <label>Sort order<input type="number" name="sort_order" value="{{ course.sort_order if course else 0 }}" /></label>
  </div>
  <label>Publishing status<select name="status"><option value="draft" {% if not course or course.status != 'published' %}selected{% endif %}>Draft (hidden from catalog)</option><option value="published" {% if course and course.status == 'published' %}selected{% endif %}>Published</option></select></label>
  <button type="submit" class="acad-btn acad-btn--primary">Save course</button>
</form>
{% endblock %}
