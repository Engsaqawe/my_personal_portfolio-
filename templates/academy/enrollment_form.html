{% extends "academy/base.html" %}
{% block title %}{{ 'Edit' if enrollment else 'Add' }} enrollment{% endblock %}
{% block content %}
<header class="acad-header"><div><h1>{{ 'Edit' if enrollment else 'Add' }} enrollment</h1><p>Grant a student access to a course.</p></div><a href="{{ url_for('academy.enrollments_list') }}" class="acad-btn acad-btn--ghost">← Back</a></header>
<form class="acad-card acad-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Student<select name="student_id" required><option value="">Choose a student</option>{% for s in students %}<option value="{{ s.id }}" {% if enrollment and enrollment.student_id == s.id %}selected{% endif %}>{{ s.name }} — {{ s.email }}</option>{% endfor %}</select></label><label>Course<select name="course_id" required><option value="">Choose a course</option>{% for c in courses %}<option value="{{ c.id }}" {% if enrollment and enrollment.course_id == c.id %}selected{% endif %}>{{ c.title }}</option>{% endfor %}</select></label><div class="acad-form__row"><label>Status<select name="status">{% for st in ['active','paused','completed','cancelled'] %}<option value="{{ st }}" {% if enrollment and enrollment.status == st %}selected{% endif %}>{{ st|title }}</option>{% endfor %}</select></label><label>Progress<input type="number" name="progress" min="0" max="100" value="{{ enrollment.progress if enrollment else 0 }}"></label></div><button class="acad-btn acad-btn--primary">Save enrollment</button></form>
{% endblock %}
