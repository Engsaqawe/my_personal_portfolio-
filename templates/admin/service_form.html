{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if service else 'New' }} Service{% endblock %}
{% block content %}
<header class="admin-header">
  <div><h1>{{ 'Edit' if service else 'New' }} service</h1><p>Service card content and its visual treatment.</p></div>
  <a href="{{ url_for('admin.services_list') }}" class="admin-btn admin-btn--ghost">← Back</a>
</header>

<form class="admin-card admin-form" method="POST">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="admin-form__grid">
    <label>Title<input name="title" required maxlength="160" value="{{ service.title if service else '' }}"></label>
    <label>Slug<input name="slug" maxlength="120" value="{{ service.slug if service else '' }}" placeholder="Generated from title if left blank"><small>Lowercase letters, numbers, and hyphens.</small></label>
    <label>Icon classes<input name="icon_class" required value="{{ service.icon_class if service else 'fa-solid fa-code' }}" placeholder="fa-solid fa-code"><small>Font Awesome classes, for example: fa-solid fa-code</small></label>
    <label>Accent color<input name="accent_color" type="color" required value="{{ service.accent_color if service else '#0BA22E' }}"></label>
    <label>Decorative visual<select name="art_type">{% for art in art_types %}<option value="{{ art }}" {% if service and service.art_type == art %}selected{% elif not service and art == 'web' %}selected{% endif %}>{{ art|title }}</option>{% endfor %}</select></label>
    <label>Display order<input name="sort_order" type="number" value="{{ service.sort_order if service else 0 }}"></label>
    <label>Button label<input name="cta_label" maxlength="120" value="{{ service.cta_label if service else 'Let’s talk' }}"></label>
    <label>Button URL<input name="cta_url" required maxlength="500" value="{{ service.cta_url if service else '#contact' }}"><small>Use #contact, an internal path, or an HTTPS URL.</small></label>
    <label class="admin-check"><input name="is_active" type="checkbox" {% if not service or service.is_active %}checked{% endif %}> Show on website</label>
  </div>
  <label>Description<textarea name="description" rows="3" required>{{ service.description if service else '' }}</textarea></label>
  <label>Tags (one per line)<textarea name="tags" rows="4">{{ service.tags if service else '' }}</textarea></label>
  <button type="submit" class="admin-btn admin-btn--primary">Save service</button>
</form>
{% endblock %}
