{% extends "admin/base.html" %}
{% block title %}Certificates{% endblock %}
{% block content %}
<header class="admin-header">
  <div><h1>Certificates</h1></div>
  <a href="{{ url_for('admin.certificate_form') }}" class="admin-btn admin-btn--primary"><i class="fa-solid fa-plus"></i> Add</a>
</header>
<div class="admin-card admin-table-wrap">
  <table class="admin-table admin-table--responsive">
    <thead><tr><th>Rank</th><th>Image</th><th>Title</th><th>Year</th><th>Actions</th></tr></thead>
    <tbody>
      {% for c in certificates %}
      <tr>
        <td data-label="Rank">{{ c.sort_order }}</td>
        <td data-label="Image"><img class="admin-thumb" src="{{ url_for('static', filename=c.image_url) }}" alt="" /></td>
        <td data-label="Title">{{ c.title }}</td>
        <td data-label="Year">{{ c.year }}</td>
        <td data-label="Actions" class="admin-table__actions">
          <a href="{{ url_for('admin.certificate_form', item_id=c.id) }}" class="admin-btn admin-btn--sm">Edit</a>
          <form method="POST" action="{{ url_for('admin.certificate_delete', item_id=c.id) }}" onsubmit="return confirm('Delete?')">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="admin-btn admin-btn--sm admin-btn--danger">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr class="admin-table__empty"><td colspan="5" class="admin-muted">No certificates yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
